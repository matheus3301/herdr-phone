<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Herdr Phone">
  <!-- Maskable: all meaningful marks sit inside the central 80% safe zone. -->
  <rect width="512" height="512" fill="#101820"/>
  <!-- Bulkhead frame: a compact field-instrument bezel -->
  <rect x="96" y="96" width="320" height="320" rx="28" fill="#192732"/>
  <rect x="96" y="96" width="320" height="320" rx="28" fill="none" stroke="#2b3d4a" stroke-width="4"/>
  <!-- Inset seams -->
  <line x1="128" y1="168" x2="384" y2="168" stroke="#0c141b" stroke-width="6"/>
  <line x1="128" y1="344" x2="384" y2="344" stroke="#0c141b" stroke-width="6"/>
  <!-- Terminal prompt caret (Mist) -->
  <path d="M150 232 l40 24 l-40 24" fill="none" stroke="#DCE7E4" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="212" y="272" width="88" height="14" rx="7" fill="#50A8A3"/>
  <!-- Attention beacon (Brass) — the "needs you" signal -->
  <circle cx="344" cy="256" r="26" fill="#E3B341"/>
  <circle cx="344" cy="256" r="26" fill="none" stroke="#101820" stroke-width="6"/>
</svg>
