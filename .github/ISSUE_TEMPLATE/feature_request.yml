name: Feature request
description: Suggest an improvement to herdr-phone
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is consistent with the project's v0.1.0 non-goals (no Windows host, no native iOS/Android apps or APNs, no multi-user or simultaneous terminal controllers, no automatic Cloudflare/DNS/Access provisioning, no automatic cloudflared install, no multi-session Herdr aggregation).
          required: false
        - label: This does not weaken the secure-by-default posture (loopback-only origin, Access JWT validation, mandatory pairing, strict Origin/CSRF/CSP, ANSI filtering).
          required: false
